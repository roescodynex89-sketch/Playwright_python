<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Playwright Practice Lab</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background-color: #f4f4f4;
      }
      .container {
        max-width: 800px;
        background: white;
        padding: 20px;
        border-radius: 8px;
      }
      .product-card {
        border: 1px solid #ddd;
        padding: 15px;
        margin: 10px 0;
        border-radius: 5px;
        background: #fafafa;
      }
      .hidden-panel {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #e2f0d9;
        border: 1px solid #385723;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Welcome to Playwright Sandbox</h1>

      <!-- Login Area -->
      <div id="login-section">
        <h3>Account Login</h3>
        <input type="text" id="username" placeholder="Enter Username" />
        <input type="password" id="password" placeholder="Enter Password" />
        <button id="login-btn" onclick="login()">Login</button>
        <p id="login-msg"></p>
      </div>

      <!-- Dynamic Content Area -->
      <div id="dashboard" class="hidden-panel">
        <h2>Dashboard (Logged In)</h2>
        <button id="load-data-btn" onclick="loadDynamicContent()">
          Load Dynamic Products
        </button>

        <!-- File Download Simulation -->
        <p>
          <a
            href="#"
            id="download-link"
            style="display: none"
            onclick="simulateDownload(event)"
            >📥 Download Report.pdf</a
          >
        </p>

        <!-- Product List (Will be injected dynamically) -->
        <div id="product-list"></div>
      </div>
    </div>

    <script>
      // Login Simulation
      function login() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        if (user === "admin" && pass === "secret123") {
          document.cookie = "session_token=mock_token_abc123; path=/";
          document.getElementById("login-section").style.display = "none";
          document.getElementById("dashboard").style.display = "block";
        } else {
          document.getElementById("login-msg").innerText =
            "Invalid credentials!";
        }
      }

      // Dynamic Content Simulation (Takes 2 seconds)
      function loadDynamicContent() {
        document.getElementById("load-data-btn").innerText = "Loading...";
        setTimeout(() => {
          const list = document.getElementById("product-list");
          list.innerHTML = `
                <div class="product-card">
                    <h3 class="product-title">Laptop Pro Max</h3>
                    <p class="price">$1200</p>
                    <a href="https://example.com" class="details-link">View Details</a>
                </div>
                <div class="product-card">
                    <h3 class="product-title">Wireless Mouse</h3>
                    <p class="price">$25</p>
                    <a href="https://example.com" class="details-link">View Details</a>
                </div>
            `;
          document.getElementById("download-link").style.display = "inline";
        }, 2000);
      }

      // Download Simulation
      function simulateDownload(e) {
        e.preventDefault();
        const blob = new Blob(
          [
            "This is a sample PDF report content generated by Playwright Practice Lab.",
          ],
          { type: "application/pdf" },
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "Report.pdf";
        a.click();
      }
    </script>
  </body>
</html>
